name: Portfolio Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/portfolio-screenshots.yml'
      - 'scripts/capture-portfolio-screenshots.mjs'

permissions:
  contents: write

jobs:
  capture:
    name: Capture AskIn UI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start AskIn frontend
        run: |
          npm run pyodide:fetch
          npx vite dev --host 127.0.0.1 --port 4173 > /tmp/askin-vite.log 2>&1 &

          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/auth >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/askin-vite.log || true
          exit 1

      - name: Capture screenshots with Playwright
        env:
          FRONTEND_URL: http://127.0.0.1:4173
          SCREENSHOT_DIR: screenshots/portfolio
        run: node scripts/capture-portfolio-screenshots.mjs

      - name: Save screenshots to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots/portfolio/*.png

          if git diff --cached --quiet; then
            echo 'Screenshots unchanged.'
            exit 0
          fi

          git commit -m 'docs: update AskIn portfolio screenshots'
          git push

      - name: Print logs on failure
        if: failure()
        run: cat /tmp/askin-vite.log || true

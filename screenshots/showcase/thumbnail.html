<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AskIn — Product showcase</title>
  <style>
    @font-face {
      font-family: Mona;
      src: url('../../static/assets/fonts/Mona-Sans.woff2') format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      background: #101513;
      font-family: Mona, Arial, sans-serif;
    }
    .thumbnail {
      position: relative;
      width: min(100vw, 1920px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      container-type: inline-size;
      background: #111a17;
      color: #f3f6ee;
      isolation: isolate;
    }
    .thumbnail::before {
      content: '';
      position: absolute;
      width: 68%;
      aspect-ratio: 1;
      right: -14%;
      top: -43%;
      border-radius: 50%;
      background: radial-gradient(circle, #315844 0%, #1c3328 40%, transparent 68%);
      opacity: .75;
      z-index: -1;
    }
    .header {
      position: absolute;
      inset: 6.3% 5.5% auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: .72cqw; font-size: 1.9cqw; font-weight: 650; letter-spacing: -.06cqw; }
    .brand img { width: 2.7cqw; height: 2.7cqw; border-radius: 50%; }
    .category { color: #a5b5aa; font-size: .8cqw; font-weight: 600; letter-spacing: .17cqw; }
    .copy { position: absolute; top: 27%; left: 5.5%; width: 32%; }
    .eyebrow { margin: 0 0 1.45cqw; color: #c6e99a; font-size: .84cqw; font-weight: 650; letter-spacing: .13cqw; text-transform: uppercase; }
    h1 { margin: 0; font-size: 7.8cqw; font-weight: 720; line-height: 1; letter-spacing: -.49cqw; }
    h1 span { color: #c6e99a; }
    .headline { margin: 1.5cqw 0 1.35cqw; font-size: 2.65cqw; font-weight: 550; line-height: 1.17; letter-spacing: -.09cqw; }
    .description { margin: 0; color: #aab9af; font-size: 1.15cqw; line-height: 1.6; }
    .product {
      position: absolute;
      top: 22.5%;
      left: 40%;
      width: 56%;
      margin: 0;
      padding: .38cqw;
      border: 1px solid #708371;
      border-radius: 1.16cqw;
      background: #dbe3d7;
      box-shadow: 0 2.4cqw 5cqw #0007;
      transform: rotate(-2deg);
    }
    .product img { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: .8cqw; }
    .caption {
      position: absolute;
      right: 5.5%;
      top: 84%;
      display: flex;
      align-items: center;
      gap: .5cqw;
      color: #a5b5aa;
      font-size: .78cqw;
      letter-spacing: .03cqw;
    }
    .caption::before { content: ''; width: .35cqw; height: .35cqw; border-radius: 50%; background: #c6e99a; }
    .footer {
      position: absolute;
      left: 5.5%;
      bottom: 6.3%;
      display: flex;
      align-items: center;
      gap: 1.3cqw;
      color: #d3ddd2;
      font-size: .88cqw;
      font-weight: 500;
    }
    .footer span + span { border-left: 1px solid #45584a; padding-left: 1.3cqw; }
  </style>
</head>
<body>
  <main class="thumbnail" aria-label="AskIn product showcase">
    <header class="header">
      <div class="brand"><img src="../../static/favicon.png" alt=""><span>AskIn</span></div>
      <div class="category">AI CONVERSATION WORKSPACE</div>
    </header>
    <section class="copy">
      <p class="eyebrow">A little more clarity.</p>
      <h1>AskIn<span>.</span></h1>
      <p class="headline">Your AI.<br>One workspace.</p>
      <p class="description">Conversations, code, and ideas.<br>Bring it all together.</p>
    </section>
    <figure class="product">
      <img src="askin-showcase.png" alt="AskIn interface with model selection, prompt suggestions, chat history, and a message composer">
    </figure>
    <div class="caption">One place to start your next idea.</div>
    <footer class="footer">
      <span>Multi-model chat</span><span>Code conversations</span><span>Prompt workspace</span>
    </footer>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AskIn — AI conversation workspace</title>
  <style>
    @font-face {
      font-family: 'Mona Sans';
      src: url('../../static/assets/fonts/Mona-Sans.woff2') format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { display: grid; place-items: center; min-height: 100vh; background: #ececec; font-family: 'Mona Sans', Arial, sans-serif; }
    .thumbnail {
      /* AskIn's light theme: neutral surfaces, soft borders, black wordmark. */
      --surface: #f9f9f9;
      --ink: #171717;
      --muted: #676767;
      --border: #e3e3e3;
      position: relative;
      width: min(100vw, 1920px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      container-type: inline-size;
      color: var(--ink);
      background: var(--surface);
    }
    .header { position: absolute; top: 5.9%; left: 4.2%; right: 4.2%; display: flex; align-items: center; justify-content: space-between; }
    .identity { display: flex; align-items: center; gap: 1.1cqw; }
    /* Align the visible symbol's baseline with the wordmark, including the PNG's internal padding. */
    .identity img { width: 4.7cqw; height: 4.7cqw; transform: translateY(.6cqw); }
    h1 { margin: 0; font-size: 5.2cqw; line-height: 1; font-weight: 700; letter-spacing: -.3cqw; }
    .intro { width: 43%; }
    .intro h2 { margin: 0 0 .6cqw; font-size: 2.15cqw; font-weight: 600; line-height: 1.2; letter-spacing: -.07cqw; }
    .intro p { margin: 0; font-size: 1cqw; line-height: 1.5; color: var(--muted); }
    .board { position: absolute; top: 24%; left: 4.2%; right: 4.2%; bottom: 8.7%; display: grid; grid-template-columns: 1.65fr 1fr; gap: 1.5cqw; }
    figure { margin: 0; }
    .panel { overflow: hidden; border: 1px solid var(--border); border-radius: 1.05cqw; background: white; box-shadow: 0 .3cqw .9cqw #17171705, 0 1.1cqw 2.5cqw #17171705; }
    .label { display: flex; align-items: center; justify-content: space-between; height: 3.05cqw; padding: 0 1.2cqw; border-bottom: 1px solid var(--border); font-size: .97cqw; font-weight: 550; }
    .label small { font-size: .7cqw; color: var(--muted); font-weight: 450; }
    .hero { position: relative; }
    .hero > img { display: block; width: 100%; height: calc(100% - 3.05cqw); object-fit: cover; object-position: top; }
    .support { display: grid; grid-template-rows: 1.1fr 1fr; gap: 1.5cqw; min-height: 0; }
    .detail { position: relative; }
    .detail > img { display: block; width: calc(100% - 2cqw); margin: 1cqw; }
    .code > img { height: calc(100% - 4.65cqw); object-fit: contain; object-position: top; }
    .prompts > img { margin-top: .8cqw; }
    .model-card { position: absolute; width: 22cqw; left: 35.5%; top: 62.2%; z-index: 2; box-shadow: 0 .5cqw 1.2cqw #1717170c, 0 1.3cqw 2.8cqw #17171712; }
    .model-card .label { height: 2.65cqw; font-size: .9cqw; }
    .model-card img { display: block; width: calc(100% - 1.5cqw); margin: .75cqw; }
    .footer { position: absolute; bottom: 3.6%; left: 4.2%; right: 4.2%; display: flex; align-items: center; justify-content: space-between; font-size: .85cqw; color: var(--muted); }
    .features { display: flex; align-items: center; gap: 1.3cqw; }
    .features span + span::before { content: '·'; margin-right: 1.3cqw; color: #b4b4b4; }
    .footer > span { font-size: .73cqw; letter-spacing: .04cqw; }
  </style>
</head>
<body>
  <main class="thumbnail" aria-label="AskIn product showcase with four application screens">
    <header class="header">
      <div class="identity"><img src="../../static/favicon.png" alt=""><h1>AskIn</h1></div>
      <div class="intro">
        <h2>A workspace for your AI conversations.</h2>
        <p>Explore ideas. Work through code. Keep your prompts close.</p>
      </div>
    </header>
    <section class="board" aria-label="Application screens">
      <figure class="panel hero">
        <figcaption class="label">Start a conversation <small>01 / CHAT</small></figcaption>
        <img src="thumbnail-ui/chat.png" alt="AskIn New Chat screen with history, suggested prompts, and message composer">
      </figure>
      <div class="support">
        <figure class="panel detail code">
          <figcaption class="label">Work through code <small>02 / CONVERSATION</small></figcaption>
          <img src="thumbnail-ui/code.png" alt="AskIn conversation showing an assistant response with highlighted TypeScript code">
        </figure>
        <figure class="panel detail prompts">
          <figcaption class="label">Keep your best prompts <small>03 / WORKSPACE</small></figcaption>
          <img src="thumbnail-ui/prompts.png" alt="AskIn prompt workspace with audit, summary, and translation templates">
        </figure>
      </div>
    </section>
    <figure class="panel model-card">
      <figcaption class="label">Choose your model <small>04 / MODELS</small></figcaption>
      <img src="thumbnail-ui/models.png" alt="AskIn model selector showing the default assistant and available demo models">
    </figure>
    <footer class="footer">
      <div class="features"><span>Multi-model chat</span><span>Code conversations</span><span>Reusable prompts</span></div>
      <span>AI CONVERSATION WORKSPACE</span>
    </footer>
  </main>
</body>
</html>
